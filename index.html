<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wisuda</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.datatables.net/v/bs5/jqc-1.12.4/moment-2.29.4/dt-2.1.8/b-3.1.2/b-html5-3.1.2/b-print-3.1.2/date-1.5.4/r-3.0.3/sl-2.1.0/datatables.min.css"
    />
    <link rel="stylesheet" type="text/css" href="css/generator-base.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="css/editor.bootstrap5.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.datatables.net/responsive/3.0.3/css/responsive.dataTables.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.datatables.net/searchpanes/2.3.2/css/searchPanes.dataTables.css"
    />

    <script
      type="text/javascript"
      charset="utf-8"
      src="https://cdn.datatables.net/v/bs5/jqc-1.12.4/moment-2.29.4/dt-2.1.8/b-3.1.2/b-html5-3.1.2/b-print-3.1.2/date-1.5.4/r-3.0.3/sl-2.1.0/datatables.min.js"
    ></script>
    <script
      type="text/javascript"
      src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"
    ></script>
    <script
      type="text/javascript"
      charset="utf-8"
      src="js/dataTables.editor.min.js"
    ></script>
    <script
      type="text/javascript"
      charset="utf-8"
      src="js/editor.bootstrap5.min.js"
    ></script>
    <script
      type="text/javascript"
      charset="utf-8"
      src="https://cdn.datatables.net/responsive/3.0.3/js/dataTables.responsive.js"
    ></script>
    <script
      type="text/javascript"
      charset="utf-8"
      src="https://cdn.datatables.net/responsive/3.0.3/js/responsive.dataTables.js"
    ></script>
    <script
      type="text/javascript"
      charset="utf-8"
      src="https://cdn.datatables.net/searchpanes/2.3.2/js/dataTables.searchPanes.js"
    ></script>
    <script
      type="text/javascript"
      charset="utf-8"
      src="https://cdn.datatables.net/searchpanes/2.3.2/js/searchPanes.dataTables.js"
    ></script>
  </head>
  <body class="bootstrap5 bg-light">
    <div class="container pt-4">
      <div class="row justify-content-between">
        <h1 class="col-sm-12 col-md-6 text-sm-center text-md-start">Wisuda</h1>
        <h2 class="col-sm-12 col-md-6 text-sm-center text-md-end">
          Overall Progress :
          <span
            class="bg-success p-2 rounded text-white fw-bold"
            id="percentage"
            >XXX%</span
          >
        </h2>
      </div>
      <table
        cellpadding="0"
        cellspacing="0"
        border="0"
        class="table table-striped table-bordered"
        id="wisuda"
        width="100%"
      >
        <thead>
          <tr>
            <th>Seksi</th>
            <th>Job</th>
            <th>PIC</th>
            <th>Progress (%)</th>
            <th>Keterangan</th>
          </tr>
        </thead>
      </table>
    </div>

    <!-- Modal for Authentication -->
    <div
      class="modal fade"
      id="authModal"
      tabindex="-1"
      aria-labelledby="authModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="authModalLabel">Masukkan Password</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="authForm">
              <div class="mb-3">
                <label for="password" class="form-label">Enter Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="Enter password"
                />
              </div>
            </form>
            <div class="alert alert-danger d-none" id="authError">
              Invalid password, try again!
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Lihat Data
            </button>
            <button type="button" id="authSubmit" class="btn btn-primary">
              Submit Password
            </button>
          </div>
        </div>
      </div>
    </div>
    <script>
      /*
       * Editor client script for DB table wisuda
       * Created by http://editor.datatables.net/generator
       */

      document.addEventListener("DOMContentLoaded", function () {
        showAuthModal();
        let table;
        let editor;
        function fetchAverage() {
          $.ajax({
            url: "php/avg.php", // PHP file to calculate the average
            method: "GET",
            success: function (response) {
              // Assuming the response is the calculated average
              $("#percentage").html(parseFloat(response).toFixed(2) + "%");
            },
            error: function () {
              console.log("Error fetching average from the server");
            },
          });
        }

        function initializeTable(withButtons) {
          editor = new DataTable.Editor({
            ajax: "php/table.wisuda.php",
            table: "#wisuda",
            fields: [
              {
                label: "Seksi:",
                name: "seksi",
              },
              {
                label: "Job:",
                name: "job",
              },
              {
                label: "PIC:",
                name: "pic",
              },
              {
                label: "Progress(%):",
                name: "persentase",
              },
              {
                label: "Keterangan:",
                name: "ket",
                type: "textarea"
              },
            ],
          });

          let buttonsConfig = [
            {
              extend: "collection",
              text: "Export",
              buttons: ["copy", "excel", "csv", "pdf", "print"],
            },
          ];

          if (withButtons) {
            buttonsConfig.unshift(
              { extend: "create", editor: editor },
              { extend: "edit", editor: editor },
              { extend: "remove", editor: editor }
            );
          }

          table = new DataTable("#wisuda", {
            ajax: "php/table.wisuda.php",
            columns: [
              {
                data: "seksi",
                width : "15%"
              },
              {
                data: "job",
                width : "20%"
              },
              {
                data: "pic",
                width : "15%"
              },
              {
                data: "persentase",
                type: "number",
                width : "10%"
              },
              {
                data: "ket",
                type: "textarea",
                width : "40%"
              },
            ],
            layout: {
              top: { searchPanes: {
                  show: true,
                  initCollapsed: true,
                  columns: [0,2],
                  cascadePanes: true,
                    viewTotal: true
                }},
              topStart: {
                buttons: buttonsConfig,
              },
            },
            order: [[0, "asc"]],
            select: true,
            responsive: true,
          });

          editor.on("submitComplete", function () {
            fetchAverage();
          });
        }

        function showAuthModal(action, editor) {
          // Clear any previous password or error messages
          $("#password").val("");
          $("#authError").addClass("d-none");

          // Show the modal
          let authModal = new bootstrap.Modal(
            document.getElementById("authModal")
          );
          authModal.show();

          // Handle the authentication process
          $("#authSubmit")
            .off("click")
            .on("click", function () {
              let password = $("#password").val();

              // Mock password authentication
              if (password === "admin123") {
                authModal.hide(); // Close the modal if authentication is successful
                initializeTable(true);
              } else {
                // Show error message if password is incorrect
                $("#authError").removeClass("d-none");
                initializeTable(false);
              }
            });

          $("#authModal").on("hidden.bs.modal", function () {
            if (!table) {
              initializeTable(false); // Initialize the table without buttons if modal is closed without valid authentication
            }
            fetchAverage();

            // Call the function initially when the table is loaded
            table.on("init", function () {
              fetchAverage();
            });
          });
        }
      });
    </script>
  </body>
</html>
